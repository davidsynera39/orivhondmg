<!doctype html><meta charset="utf-8"><title>Orivon</title>
<style>
html,body{margin:0;height:100%;background:#F7F5F0;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#4A5049}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
img{width:min(260px,60vw);animation:in .8s ease both}
.bar{width:140px;height:4px;border-radius:4px;background:#e6efeb;overflow:hidden}
.bar span{display:block;height:100%;background:#7DB8A0;transform-origin:left;animation:load 3s linear forwards}
.bar.loop span{animation:loop 1.4s ease-in-out infinite}
#msg{font-size:14px;min-height:20px;text-align:center}
@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes loop{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
</style>
<img src="img/orivon-logo.png" alt="Orivon">
<div class="bar" id="bar"><span></span></div>
<div id="msg"></div>
<script>
function set(t){document.getElementById("bar").classList.add("loop");document.getElementById("msg").textContent=t}
window.showWaking=function(){set("Starting up… this can take a few seconds.")};
window.showOffline=function(){set("Can't reach Orivon. Check your internet connection — retrying…")};
</script>
