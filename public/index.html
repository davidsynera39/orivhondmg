<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orivon — Your AI guide for learning, career and opportunity</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#7DB8A0" />
<meta property="og:title" content="Orivon" />
<meta property="og:image" content="/icon-512.png" />
<link rel="stylesheet" href="style.css?v=21" />
<style>
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#F7F5F0;transition:opacity .5s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:min(260px,60vw);height:auto;animation:splashIn .8s ease both}
.splash-bar{width:140px;height:4px;border-radius:4px;background:#e6efeb;overflow:hidden}
.splash-bar span{display:block;height:100%;width:100%;background:#7DB8A0;transform-origin:left;animation:splashLoad 3s linear forwards}
@keyframes splashIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes splashLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="/img/orivon-logo.png" alt="" /><div class="splash-bar"><span></span></div></div>
<div id="app"></div>
<script>
// Splash screen: logo for ~3 seconds while the app loads, then fade into login.
(function () {
  var s = document.getElementById("splash");
  setTimeout(function () {
    s.classList.add("hide");
    setTimeout(function () { s.remove(); }, 500);
  }, 3000);
})();
</script>
<script src="app.js?v=31"></script>
</body>
</html>
