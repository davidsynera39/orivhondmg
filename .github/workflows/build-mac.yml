name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm install --no-save --force --no-audit --no-fund @napi-rs/canvas-darwin-x64@0.1.80 @napi-rs/canvas-darwin-arm64@0.1.80
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Orivon-dmg
          path: dist/*.dmg
          if-no-files-found: error
